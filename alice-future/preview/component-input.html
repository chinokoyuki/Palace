<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { width: 92px; font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
.af-input { min-width: 120px; flex-shrink: 0; background: var(--color-surface); color: var(--color-foreground); border: 1px solid var(--color-border); border-radius: var(--radius-input); padding: 12px 16px; font-family: var(--font-body); font-size: var(--font-size-body); outline: none; transition: border-color var(--duration-hover) var(--ease-spring), box-shadow var(--duration-hover) var(--ease-spring); }
.af-input::placeholder { color: var(--color-muted-foreground); }
.af-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(59,167,255,0.15), 0 0 16px rgba(59,167,255,0.12); animation: af-glow-pulse var(--duration-ai) var(--ease-smooth) ease-in-out infinite; }
.af-input:disabled { opacity: 0.5; cursor: not-allowed; }
.af-input.glass { background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); }
.af-input.glass:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(59,167,255,0.15); }
.af-input-wrap { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; }
.af-input-icon { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--color-muted); pointer-events: none; }
.af-input.has-icon { padding-left: 40px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Default</span><input class="af-input" type="text" placeholder="Ask Alice anything..." data-evidence-sample="default-ask-alice"></div>
<div class="row"><span class="label">Disabled</span><input class="af-input" type="text" placeholder="Enter API key..." disabled data-evidence-sample="default-api-key"></div>
<hr class="divider">
<div class="row"><span class="label">Glass</span><span class="af-input-wrap"><i data-lucide="search" class="af-input-icon"></i><input class="af-input glass has-icon" type="text" placeholder="Search intelligence..." data-evidence-sample="glass-search"></span></div>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
