<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.label { flex-shrink: 0; width: 160px; font-size: var(--font-size-caption); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }

/* @component-css-start */
.af-slider { flex: 1; min-width: 0; width: 100%; position: relative; padding: var(--space-2) 0; }
.af-slider-track { width: 100%; height: 4px; border-radius: var(--radius-full); background: var(--color-outline); position: relative; }
.af-slider-fill { height: 100%; border-radius: var(--radius-full); background: var(--color-primary); transition: width var(--duration-hover) var(--ease-smooth); }
.af-slider-thumb { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: var(--radius-full); background: var(--color-on-primary); border: 2px solid var(--color-primary); transform: translate(-50%, -50%); box-shadow: var(--shadow-xs); transition: transform var(--duration-hover) var(--ease-spring); cursor: grab; }
.af-slider-thumb:hover { transform: translate(-50%, -50%) scale(1.15); }
.af-slider-fill.ai { background: var(--gradient-future); box-shadow: var(--shadow-ai-glow); }
.af-slider-thumb.ai { border-color: var(--color-primary); box-shadow: var(--shadow-ai-glow); }
.af-slider.disabled { opacity: var(--opacity-disabled); cursor: not-allowed; }
.af-slider.disabled .af-slider-thumb { cursor: not-allowed; }
.af-slider.disabled .af-slider-thumb:hover { transform: translate(-50%, -50%); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Temperature — 60°</span><div class="af-slider"><div class="af-slider-track"><div class="af-slider-fill" style="width:60%"></div><div class="af-slider-thumb" style="left:60%"></div></div></div></div>
<div class="row"><span class="label">Creativity — 75%</span><div class="af-slider"><div class="af-slider-track"><div class="af-slider-fill ai" style="width:75%"></div><div class="af-slider-thumb ai" style="left:75%"></div></div></div></div>
<hr class="divider">
<div class="row"><span class="label">Max tokens — 4096</span><div class="af-slider"><div class="af-slider-track"><div class="af-slider-fill" style="width:40%"></div><div class="af-slider-thumb" style="left:40%"></div></div></div></div>
<div class="row"><span class="label">Voice pitch — locked</span><div class="af-slider disabled"><div class="af-slider-track"><div class="af-slider-fill" style="width:50%"></div><div class="af-slider-thumb" style="left:50%"></div></div></div></div>
</body>
</html>
