<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); padding-top: 6px; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
.af-card { width: 100%; border-radius: var(--radius-card); padding: var(--space-4); transition: box-shadow var(--duration-hover) var(--ease-out), transform var(--duration-hover) var(--ease-out); animation: af-slide-up var(--duration-slide) var(--ease-out) both; }
.af-card-title { margin: 0 0 var(--space-2) 0; font-family: var(--font-heading); font-size: var(--font-size-h3); font-weight: 600; line-height: 1.4; color: var(--color-foreground); }
.af-card-body { margin: 0; font-family: var(--font-body); font-size: var(--font-size-body); font-weight: 400; line-height: 1.5; color: var(--color-muted); }
.af-card.glass-light { background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); box-shadow: var(--shadow-sm); }
.af-card.glass-light:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); }
.af-card.glass-blue { background: var(--glass-blue-bg); backdrop-filter: blur(var(--glass-blue-blur)); -webkit-backdrop-filter: blur(var(--glass-blue-blur)); box-shadow: var(--shadow-ai-glow); }
.af-card.glass-blue:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); }
.af-card.solid { background: var(--color-card); box-shadow: var(--shadow-sm); }
.af-card.solid:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Glass Light</span><div class="af-card glass-light" data-evidence-sample="glass-light"><h3 class="af-card-title">Memory Module</h3><div class="af-card-body">8,492 tokens active in context window</div></div></div>
<div class="row"><span class="label">Glass Blue</span><div class="af-card glass-blue" data-evidence-sample="glass-blue"><h3 class="af-card-title">AI Analysis</h3><div class="af-card-body">Processing 3 models in parallel</div></div></div>
<hr class="divider">
<div class="row"><span class="label">Solid</span><div class="af-card solid" data-evidence-sample="solid"><h3 class="af-card-title">System Status</h3><div class="af-card-body">All systems operational</div></div></div>
</body>
</html>
