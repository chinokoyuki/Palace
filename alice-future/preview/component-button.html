<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
.af-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: none; cursor: pointer; font-family: var(--font-body); font-weight: var(--font-weight-semibold); border-radius: var(--radius-button); white-space: nowrap; transition: filter var(--duration-transition) var(--ease-out), transform var(--duration-transition) var(--ease-out), background var(--duration-transition) var(--ease-out); flex-shrink: 0; }
.af-btn-label { white-space: nowrap; }
.af-btn-primary { background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-xs); }
.af-btn-secondary { background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); color: var(--color-primary); border: 1px solid var(--color-border); }
.af-btn-ghost { background: transparent; color: var(--color-primary); }
.af-btn-primary:hover { filter: brightness(1.1); transform: scale(1.02); box-shadow: var(--shadow-ai-glow); }
.af-btn-secondary:hover, .af-btn-ghost:hover { filter: brightness(1.05); transform: scale(1.02); }
.af-btn-ghost:hover { background: rgba(59,167,255,0.08); filter: none; transform: none; }
.af-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; box-shadow: none; }
.af-btn-sm { height: 36px; min-width: 36px; padding: 8px 20px; font-size: var(--font-size-caption); }
.af-btn-md { height: var(--size-button-height); min-width: var(--size-button-height); padding: 12px 32px; font-size: var(--font-size-body); }
.af-btn-lg { height: 52px; min-width: 52px; padding: 14px 40px; font-size: var(--font-size-h3); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Primary</span><button class="af-btn af-btn-primary af-btn-md"><span class="af-btn-label">Start Analysis</span></button><button class="af-btn af-btn-primary af-btn-md"><span class="af-btn-label">Ask Alice</span></button><button class="af-btn af-btn-primary af-btn-md"><span class="af-btn-label">Activate AI</span></button></div>
<div class="row"><span class="label">Secondary</span><button class="af-btn af-btn-secondary af-btn-md"><span class="af-btn-label">Settings</span></button><button class="af-btn af-btn-secondary af-btn-md"><span class="af-btn-label">Export</span></button><button class="af-btn af-btn-secondary af-btn-md"><span class="af-btn-label">Share</span></button></div>
<div class="row"><span class="label">Ghost</span><button class="af-btn af-btn-ghost af-btn-md"><span class="af-btn-label">Cancel</span></button><button class="af-btn af-btn-ghost af-btn-md"><span class="af-btn-label">Skip</span></button><button class="af-btn af-btn-ghost af-btn-md"><span class="af-btn-label">Later</span></button></div>
<hr class="divider">
<div class="row"><span class="label">Sizes</span><button class="af-btn af-btn-primary af-btn-sm"><span class="af-btn-label">Start Analysis</span></button><button class="af-btn af-btn-primary af-btn-md"><span class="af-btn-label">Start Analysis</span></button><button class="af-btn af-btn-primary af-btn-lg"><span class="af-btn-label">Start Analysis</span></button></div>
<div class="row"><span class="label">Disabled</span><button class="af-btn af-btn-primary af-btn-md" disabled><span class="af-btn-label">Start Analysis</span></button><button class="af-btn af-btn-secondary af-btn-md" disabled><span class="af-btn-label">Settings</span></button><button class="af-btn af-btn-ghost af-btn-md" disabled><span class="af-btn-label">Cancel</span></button></div>
</body>
</html>
