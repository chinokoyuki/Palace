<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeleton — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--color-muted-foreground); }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .af-skeleton { background: linear-gradient(90deg, var(--color-outline) 0%, var(--color-surface-variant) 50%, var(--color-outline) 100%); background-size: 200% 100%; animation: af-shimmer var(--duration-shimmer) linear infinite; }
  .af-skeleton-text { height: 16px; width: 100%; border-radius: var(--radius-sm); }
  .af-skeleton-text.w-80 { width: 80%; }
  .af-skeleton-text.w-60 { width: 60%; }
  .af-skeleton-rect { width: 100%; height: 120px; border-radius: var(--radius-md); }
  .af-skeleton-circle { width: 48px; height: 48px; border-radius: var(--radius-full); flex-shrink: 0; }
  .af-skeleton-card { width: 100%; border-radius: var(--radius-card); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); background: var(--color-card); box-shadow: var(--shadow-sm); }
  .af-skeleton-card .card-head { display: flex; align-items: center; gap: var(--space-3); }
  .af-skeleton-card .card-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">Text</span>
    <div class="stage">
      <div class="af-skeleton af-skeleton-text"></div>
      <div class="af-skeleton af-skeleton-text w-80"></div>
      <div class="af-skeleton af-skeleton-text w-60"></div>
    </div>
  </div>
  <div class="row">
    <span class="label">Rect</span>
    <div class="stage">
      <div class="af-skeleton af-skeleton-rect"></div>
    </div>
  </div>
  <div class="row">
    <span class="label">Circle</span>
    <div class="stage">
      <div class="af-skeleton af-skeleton-circle"></div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Card</span>
    <div class="stage">
      <div class="af-skeleton-card">
        <div class="card-head">
          <div class="af-skeleton af-skeleton-circle"></div>
          <div class="card-lines">
            <div class="af-skeleton af-skeleton-text"></div>
            <div class="af-skeleton af-skeleton-text w-60"></div>
          </div>
        </div>
        <div class="af-skeleton af-skeleton-rect"></div>
      </div>
    </div>
  </div>
</body>
</html>
