<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabs — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); font-size: var(--font-size-body); }
  .row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--color-muted-foreground); white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .af-tabs-underline { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--color-border); }
  .af-tab { padding: var(--space-2) var(--space-3); background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--color-muted); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-medium); cursor: pointer; transition: var(--transition-color); white-space: nowrap; flex-shrink: 0; margin-bottom: -1px; }
  .af-tab:hover { color: var(--color-foreground); }
  .af-tab.is-active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: var(--font-weight-semibold); }
  .af-tabs-pill { display: inline-flex; gap: var(--space-1); padding: var(--space-1); background: var(--color-surface); border-radius: var(--radius-button); }
  .af-tab--pill { padding: var(--space-2) var(--space-4); border: none; background: transparent; border-radius: var(--radius-button); color: var(--color-muted); font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); cursor: pointer; transition: var(--transition-color); white-space: nowrap; flex-shrink: 0; }
  .af-tab--pill:hover { color: var(--color-foreground); }
  .af-tab--pill.is-active { background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-xs); }
  .af-tabs-glass { display: inline-flex; gap: var(--space-1); padding: var(--space-1); background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); border-radius: var(--radius-button); }
  .af-tab--glass { padding: var(--space-2) var(--space-4); border: none; background: transparent; border-radius: var(--radius-button); color: var(--color-muted); font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); cursor: pointer; transition: var(--transition-color); white-space: nowrap; flex-shrink: 0; }
  .af-tab--glass:hover { color: var(--color-foreground); }
  .af-tab--glass.is-active { background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-xs); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">Underline</span>
    <div class="af-tabs-underline" data-evidence-sample="underline-overview">
      <button class="af-tab is-active">Overview</button>
      <button class="af-tab">Memory</button>
      <button class="af-tab">Analysis</button>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Pill</span>
    <div class="af-tabs-pill" data-evidence-sample="pill-week">
      <button class="af-tab--pill">Day</button>
      <button class="af-tab--pill is-active">Week</button>
      <button class="af-tab--pill">Month</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Glass</span>
    <div class="af-tabs-glass" data-evidence-sample="glass-insights">
      <button class="af-tab--glass">Dashboard</button>
      <button class="af-tab--glass is-active">Insights</button>
      <button class="af-tab--glass">Settings</button>
    </div>
  </div>
</body>
</html>
