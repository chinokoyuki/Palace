<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
.label { width: 92px; flex-shrink: 0; font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--color-muted-foreground); letter-spacing: var(--tracking-wide); text-transform: uppercase; padding-top: var(--space-4); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
.af-stat { width: 100%; padding: var(--space-4); border-radius: var(--radius-card); background: var(--color-surface); border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: var(--space-1); box-sizing: border-box; }
.af-stat-label { font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--color-muted-foreground); letter-spacing: var(--tracking-wide); text-transform: uppercase; }
.af-stat-value { font-family: var(--font-heading); font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); color: var(--color-foreground); line-height: var(--line-height-tight); letter-spacing: var(--tracking-tight); }
.af-stat-trend { font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); }
.af-stat-trend.up { color: var(--color-success); }
.af-stat-trend.down { color: var(--color-error); }
.af-stat-trend.neutral { color: var(--color-muted); }
.af-stat.glass { background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); box-shadow: var(--shadow-xs); }
.af-stat.ai { background: var(--glass-blue-bg); backdrop-filter: blur(var(--glass-blue-blur)); -webkit-backdrop-filter: blur(var(--glass-blue-blur)); border: 1px solid var(--glass-light-border); box-shadow: var(--shadow-xs); }
.af-stat.ai .af-stat-value { color: var(--color-primary); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">Default</span><div class="af-stat" data-evidence-sample="default-total-requests"><span class="af-stat-label">Total Requests</span><div class="af-stat-value">1.2M</div><span class="af-stat-trend up">+12.3%</span></div></div>
<div class="row"><span class="label">Default</span><div class="af-stat" data-evidence-sample="default-active-users"><span class="af-stat-label">Active Users</span><div class="af-stat-value">3,842</div><span class="af-stat-trend neutral">stable</span></div></div>
<hr class="divider">
<div class="row"><span class="label">Glass</span><div class="af-stat glass" data-evidence-sample="glass-avg-latency"><span class="af-stat-label">Avg Latency</span><div class="af-stat-value">42ms</div><span class="af-stat-trend down">-8.1%</span></div></div>
<div class="row"><span class="label">AI</span><div class="af-stat ai" data-evidence-sample="ai-accuracy"><span class="af-stat-label">AI Accuracy</span><div class="af-stat-value">98.7%</div><span class="af-stat-trend up">+0.4%</span></div></div>
</body>
</html>
