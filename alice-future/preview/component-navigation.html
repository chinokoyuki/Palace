<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-muted-foreground); }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

  /* @component-css-start */
  .af-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; height: var(--size-nav-height); padding: var(--space-2) var(--space-4); background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); box-sizing: border-box; animation: af-slide-down var(--duration-slide) var(--ease-out) both; }
  .af-nav-logo { display: inline-flex; align-items: center; gap: var(--space-2); font-family: var(--font-heading); font-weight: var(--font-weight-semibold); font-size: var(--font-size-body); color: var(--color-foreground); white-space: nowrap; }
  .af-nav-logo .mark { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--gradient-future); box-shadow: var(--shadow-xs); flex-shrink: 0; }
  .af-nav-menu { display: flex; align-items: center; gap: var(--space-1); flex-shrink: 0; }
  .af-nav-item { display: inline-flex; align-items: center; padding: var(--space-2) var(--space-3); font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-muted); border-radius: var(--radius-md); white-space: nowrap; cursor: pointer; text-decoration: none; transition: background var(--duration-hover) var(--ease-smooth), transform var(--duration-hover) var(--ease-spring); }
  .af-nav-item:hover { background: var(--glass-blue-bg); transform: translateY(-1px); }
  .af-nav-item.is-active { color: var(--color-primary); background: var(--glass-blue-bg); }
  .af-nav-user { display: inline-flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .af-nav-avatar { width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--gradient-future); display: inline-flex; align-items: center; justify-content: center; font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); color: var(--color-on-primary); flex-shrink: 0; box-shadow: var(--shadow-xs); }
  .af-nav-pill { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-4); background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">Floating</span></div>
  <div class="row">
    <nav class="af-nav" data-evidence-sample="floating-default">
      <div class="af-nav-logo"><span class="mark"></span>Alice Future</div>
      <div class="af-nav-menu">
        <a class="af-nav-item is-active">Dashboard</a>
        <a class="af-nav-item">Intelligence</a>
        <a class="af-nav-item">Memory</a>
        <a class="af-nav-item">Settings</a>
      </div>
      <div class="af-nav-user">
        <div class="af-nav-avatar">AF</div>
      </div>
    </nav>
  </div>
  <hr class="divider">
  <div class="row"><span class="label">Menu Items</span></div>
  <div class="row">
    <div class="af-nav-pill" data-evidence-sample="menu-items">
      <a class="af-nav-item is-active">Dashboard</a>
      <a class="af-nav-item">Intelligence</a>
      <a class="af-nav-item">Memory</a>
      <a class="af-nav-item">Settings</a>
    </div>
  </div>
</body>
</html>
