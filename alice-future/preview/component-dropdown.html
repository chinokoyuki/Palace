<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropdown — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.row-open { margin-bottom: 144px; }
.label { display: inline-block; width: 92px; flex-shrink: 0; font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--color-muted-foreground); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
.af-dropdown { position: relative; display: inline-block; }
.af-dropdown-trigger { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-foreground); font-family: var(--font-body); font-size: var(--font-size-body); cursor: pointer; min-width: 180px; transition: var(--transition-color); }
.af-dropdown-trigger:hover { border-color: var(--color-primary); }
.af-dropdown-trigger.is-open { border-color: var(--color-primary); }
.af-dropdown-trigger.glass { background: var(--glass-light-bg); backdrop-filter: blur(var(--glass-light-blur)); -webkit-backdrop-filter: blur(var(--glass-light-blur)); border: 1px solid var(--glass-light-border); }
.af-dropdown-trigger.glass:hover { border-color: var(--color-primary); }
.af-dropdown-trigger[disabled] { opacity: var(--opacity-disabled); cursor: not-allowed; }
.af-dropdown-trigger[disabled]:hover { border-color: var(--color-border); }
.af-dropdown-icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--color-muted); transition: transform var(--duration-hover) var(--ease-out), color var(--duration-hover) var(--ease-out); }
.af-dropdown-trigger:hover .af-dropdown-icon { color: var(--color-primary); }
.af-dropdown-trigger.is-open .af-dropdown-icon { transform: rotate(180deg); color: var(--color-primary); }
.af-dropdown-menu { position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%; padding: var(--space-1); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: var(--z-dropdown); animation: af-slide-down var(--duration-hover) var(--ease-out) both; }
.af-dropdown-option { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-size-body); color: var(--color-foreground); cursor: pointer; transition: var(--transition-color); white-space: nowrap; }
.af-dropdown-option:hover { background: var(--color-info-soft); color: var(--color-primary); }
.af-dropdown-option.is-selected { background: var(--color-info-soft); color: var(--color-primary); font-weight: var(--font-weight-semibold); }
/* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="af-icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </symbol>
</svg>

<div class="row">
  <span class="label">Closed</span>
  <div class="af-dropdown" data-evidence-sample="default-closed">
    <button class="af-dropdown-trigger" type="button">
      <span>Alice Pro</span>
      <svg class="af-dropdown-icon"><use href="#af-icon-chevron-down"/></svg>
    </button>
  </div>
</div>

<div class="row row-open">
  <span class="label">Open</span>
  <div class="af-dropdown" data-evidence-sample="default-open">
    <button class="af-dropdown-trigger is-open" type="button">
      <span>Project Atlas</span>
      <svg class="af-dropdown-icon"><use href="#af-icon-chevron-down"/></svg>
    </button>
    <div class="af-dropdown-menu">
      <div class="af-dropdown-option is-selected">Project Atlas</div>
      <div class="af-dropdown-option">Project Nova</div>
      <div class="af-dropdown-option">Project Iris</div>
    </div>
  </div>
</div>

<div class="row">
  <span class="label">Disabled</span>
  <div class="af-dropdown" data-evidence-sample="default-disabled">
    <button class="af-dropdown-trigger" type="button" disabled>
      <span>Alice Pro</span>
      <svg class="af-dropdown-icon"><use href="#af-icon-chevron-down"/></svg>
    </button>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">Glass</span>
  <div class="af-dropdown" data-evidence-sample="glass-closed">
    <button class="af-dropdown-trigger glass" type="button">
      <span>Dataset — Project Nova</span>
      <svg class="af-dropdown-icon"><use href="#af-icon-chevron-down"/></svg>
    </button>
  </div>
</div>

</body>
</html>
