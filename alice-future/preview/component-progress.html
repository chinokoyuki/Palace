<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: var(--tracking-wider); }
.progress-stage { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
.af-progress { flex: 1; display: flex; align-items: center; min-width: 0; }
.af-progress-track.linear { width: 100%; height: 6px; background: var(--color-outline); border-radius: var(--radius-full); overflow: hidden; }
.af-progress-fill.linear { height: 100%; border-radius: var(--radius-full); background: var(--gradient-future); transition: width var(--duration-page) var(--ease-smooth); }
.af-progress-circular { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
.af-progress-circular .track { position: absolute; inset: 0; border: 3px solid var(--color-outline); border-radius: var(--radius-full); }
.af-progress-circular .fill { position: absolute; inset: 0; border: 3px solid var(--color-primary); border-radius: var(--radius-full); border-top-color: transparent; animation: af-spin 1s linear infinite; }
.af-progress-track.ai-pulse { width: 100%; height: 4px; background: var(--glass-blue-bg); border-radius: var(--radius-full); overflow: hidden; position: relative; }
.af-progress-fill.ai-pulse { position: absolute; inset: 0; background-color: var(--color-primary); background-image: linear-gradient(90deg, transparent, var(--color-primary), transparent); background-size: 200% 100%; box-shadow: var(--shadow-ai-glow); animation: af-shimmer 1.5s linear infinite; }
.af-progress-label { font-size: var(--font-size-caption); color: var(--color-foreground); font-weight: var(--font-weight-medium); white-space: nowrap; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">Linear</span>
  <div class="progress-stage">
    <div class="af-progress"><div class="af-progress-track linear"><div class="af-progress-fill linear" style="width:65%"></div></div></div>
    <span class="af-progress-label">Training model — 65%</span>
  </div>
</div>
<div class="row">
  <span class="label">Circular</span>
  <div class="progress-stage">
    <div class="af-progress-circular"><div class="track"></div><div class="fill"></div></div>
    <span class="af-progress-label">Loading...</span>
  </div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">AI Pulse</span>
  <div class="progress-stage">
    <div class="af-progress"><div class="af-progress-track ai-pulse"><div class="af-progress-fill ai-pulse"></div></div></div>
    <span class="af-progress-label">Alice thinking...</span>
  </div>
</div>
</body>
</html>
