<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Core — Alice Future</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; gap: var(--space-4); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.af-ai-core { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-full); flex-shrink: 0; animation: af-scale-in var(--duration-scale) var(--ease-spring) both; }
.af-ai-core-glow { position: absolute; inset: 0; border-radius: var(--radius-full); box-shadow: var(--shadow-ai-glow); animation: af-pulse var(--duration-ai) var(--ease-smooth) infinite alternate; pointer-events: none; }
.af-ai-core-sphere { position: relative; border-radius: var(--radius-full); background: var(--glass-blue-bg); backdrop-filter: blur(var(--glass-blue-blur)); -webkit-backdrop-filter: blur(var(--glass-blue-blur)); display: flex; align-items: center; justify-content: center; z-index: 1; }
.af-ai-core-center { border-radius: var(--radius-full); background: radial-gradient(circle, var(--alice-sky), var(--future-blue)); animation: af-pulse var(--duration-ai) var(--ease-smooth) infinite alternate; }
.af-ai-core.sm { width: 48px; height: 48px; }
.af-ai-core.sm .af-ai-core-center { width: 24px; height: 24px; }
.af-ai-core.md { width: 96px; height: 96px; }
.af-ai-core.md .af-ai-core-center { width: 48px; height: 48px; }
.af-ai-core.lg { width: 160px; height: 160px; }
.af-ai-core.lg .af-ai-core-center { width: 80px; height: 80px; }
.af-ai-core.thinking .af-ai-core-glow { animation: af-pulse 1s var(--ease-smooth) infinite alternate; }
.af-ai-core.thinking .af-ai-core-center { animation: af-pulse 1s var(--ease-smooth) infinite alternate; }
.af-ai-core .orbit { position: absolute; inset: 0; border-radius: var(--radius-full); animation: af-ring-rotate 2s linear infinite; z-index: 2; }
.af-ai-core .particle { position: absolute; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--alice-sky); top: 50%; left: 50%; margin: -3px 0 0 -3px; opacity: 0.85; }
.af-ai-core .particle:nth-child(1) { transform: rotate(0deg) translateX(36px); }
.af-ai-core .particle:nth-child(2) { transform: rotate(120deg) translateX(36px); }
.af-ai-core .particle:nth-child(3) { transform: rotate(240deg) translateX(36px); }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
/* af-pulse and af-ring-rotate keyframes are defined in colors_and_type.css */
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">Alice AI</span>
  <div class="af-ai-core sm" data-evidence-sample="active"><div class="af-ai-core-glow"></div><div class="af-ai-core-sphere"><div class="af-ai-core-center"></div></div></div>
  <div class="af-ai-core md" data-evidence-sample="active"><div class="af-ai-core-glow"></div><div class="af-ai-core-sphere"><div class="af-ai-core-center"></div></div></div>
  <div class="af-ai-core lg" data-evidence-sample="active"><div class="af-ai-core-glow"></div><div class="af-ai-core-sphere"><div class="af-ai-core-center"></div></div></div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">Processing...</span>
  <div class="af-ai-core md thinking" data-evidence-sample="thinking"><div class="af-ai-core-glow"></div><div class="af-ai-core-sphere"><div class="af-ai-core-center"></div></div><div class="orbit"><div class="particle"></div><div class="particle"></div><div class="particle"></div></div></div>
</div>
</body>
</html>
