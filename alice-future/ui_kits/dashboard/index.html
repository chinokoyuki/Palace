<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice Future — Design System Showcase</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
  *{box-sizing:border-box}
  :root{--uikit-sidebar-w:220px}
  html,body{margin:0;padding:0}
  body{background:var(--color-background);color:var(--color-foreground);font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-size:var(--font-size-body);line-height:var(--line-height-normal)}
  .num{font-variant-numeric:tabular-nums}

  /* Layout guard skeleton */
  .uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:var(--uikit-sidebar-w,220px) minmax(0,1fr);gap:var(--space-4);padding:var(--space-4);background:var(--color-background)}
  .uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
  .uikit-sidebar{overflow:hidden;max-width:100%;display:flex;flex-direction:column;gap:var(--space-3)}
  [data-component]{min-width:0;max-width:100%;overflow:hidden}
  .uikit-main{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
  .uikit-toolbar{display:flex;align-items:center;gap:var(--space-2)}
  .uikit-responsive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--space-3);min-width:0}
  .uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
  .uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uikit-nowrap{white-space:nowrap;flex-shrink:0}
  .uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
  .uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Sidebar */
  .sidebar-card{background:var(--glass-light-bg);backdrop-filter:blur(var(--glass-light-blur));-webkit-backdrop-filter:blur(var(--glass-light-blur));border:1px solid var(--glass-light-border);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
  .sidebar-nav{display:flex;flex-direction:column;gap:var(--space-1)}
  .sidebar-nav .af-nav-item{width:100%;justify-content:flex-start;gap:var(--space-2)}
  .sidebar-foot{display:flex;align-items:center;gap:var(--space-2);padding-top:var(--space-3);border-top:1px solid var(--color-border)}
  .sidebar-foot .meta{font-size:var(--font-size-caption);color:var(--color-muted-foreground);line-height:1.3}

  /* Section heading */
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
  .section-head h2{font-family:var(--font-heading);font-size:var(--font-size-h2);font-weight:var(--font-weight-semibold);color:var(--color-foreground);margin:0;line-height:var(--line-height-tight);letter-spacing:-0.015em}
  .section-head .desc{font-size:var(--font-size-body);color:var(--color-muted);margin:0}

  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-button);background:var(--glass-blue-bg);color:var(--color-primary);font-size:var(--font-size-caption);font-weight:var(--font-weight-semibold);white-space:nowrap}
  .status-dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--alice-sky);box-shadow:0 0 12px var(--color-glow);animation:af-pulse var(--duration-ai) var(--ease-smooth) ease-in-out infinite alternate}

  /* Hero band */
  .hero-band{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding:var(--space-6) var(--space-4);border-radius:var(--radius-card);background:var(--glass-light-bg);backdrop-filter:blur(var(--glass-light-blur));-webkit-backdrop-filter:blur(var(--glass-light-blur));border:1px solid var(--glass-light-border);box-shadow:var(--shadow-sm);overflow:hidden;animation:af-slide-up var(--duration-slide) var(--ease-out) both}
  .hero-eyebrow{font-size:var(--font-size-caption);font-weight:var(--font-weight-semibold);letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent)}
  .hero-title{font-family:var(--font-heading);font-size:var(--font-size-h1);font-weight:var(--font-weight-semibold);color:var(--color-foreground);margin:0;line-height:var(--line-height-tight);letter-spacing:-0.02em;text-align:center}
  .ask-row{display:flex;gap:var(--space-2);width:100%;max-width:560px;align-items:center}
  .ask-row .af-input-wrap{flex:1;min-width:0}
  .ask-row .af-input{width:100%;height:var(--size-button-height)}

  /* Metric card */
  .metric-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2)}
  .metric-icon{width:36px;height:36px;border-radius:var(--radius-md);background:var(--glass-blue-bg);display:inline-flex;align-items:center;justify-content:center;color:var(--color-primary);flex-shrink:0}
  .metric-num{font-family:var(--font-mono);font-size:var(--font-size-h2);font-weight:var(--font-weight-bold);color:var(--color-foreground);line-height:1.1;letter-spacing:-0.01em}
  .metric-unit{font-size:var(--font-size-caption);color:var(--color-muted);margin-top:var(--space-1)}

  /* Chart */
  .chart-bars{display:flex;align-items:flex-end;gap:var(--space-1);height:128px;margin-top:var(--space-3)}
  .chart-bar{flex:1;min-width:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--color-primary);opacity:.75;transition:opacity var(--duration-hover) var(--ease-out);animation:af-scale-in var(--duration-scale) var(--ease-out) both;transform-origin:bottom}
  .chart-bar:hover{opacity:1}
  .chart-bar.peak{background:var(--alice-sky);opacity:.95}
  .chart-axis{display:flex;justify-content:space-between;margin-top:var(--space-2);font-size:var(--font-size-caption);color:var(--color-muted-foreground)}

  /* Toggle (token-only last-resort composite) */
  .switch{width:44px;height:26px;border-radius:var(--radius-button);background:var(--color-outline);position:relative;cursor:pointer;transition:background var(--duration-hover) var(--ease-smooth);flex-shrink:0;border:none;padding:0}
  .switch.on{background:var(--color-primary);box-shadow:var(--shadow-xs)}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:var(--radius-full);background:var(--color-on-primary);transition:transform var(--duration-hover) var(--ease-smooth)}
  .switch.on .knob{transform:translateX(18px)}
  .pref-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-border)}
  .pref-row:last-child{border-bottom:none}
  .pref-label{font-size:var(--font-size-body);font-weight:var(--font-weight-semibold);color:var(--color-foreground);margin:0}
  .pref-desc{font-size:var(--font-size-caption);color:var(--color-muted);margin:2px 0 0}

  .field-row{display:flex;flex-direction:column;gap:var(--space-1)}
  .field-label{font-size:var(--font-size-caption);font-weight:var(--font-weight-semibold);color:var(--color-foreground)}
  .field-help{font-size:var(--font-size-caption);color:var(--color-muted-foreground)}
  .field-input{width:100%}

  .action-row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}

  /* Modal stage */
  .modal-stage{position:relative;min-height:460px;border-radius:var(--radius-card);overflow:hidden;background:var(--glass-blue-bg);backdrop-filter:blur(var(--glass-blue-blur));-webkit-backdrop-filter:blur(var(--glass-blue-blur));border:1px solid var(--color-border)}
  .stage-pad{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
  .insight-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-md);background:var(--glass-light-bg);border:1px solid var(--glass-light-border)}
  .insight-icon{width:36px;height:36px;border-radius:var(--radius-md);background:var(--glass-blue-bg);display:inline-flex;align-items:center;justify-content:center;color:var(--color-primary);flex-shrink:0}

  .nav-search{flex:1;min-width:0;max-width:360px}
  .nav-search .af-input{width:100%;height:40px;font-size:var(--font-size-caption)}

  @media (max-width:900px){
    .uikit-shell{grid-template-columns:minmax(0,1fr)}
    .uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:640px){
    .uikit-toolbar{flex-direction:column;align-items:stretch}
    .uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}
    .ask-row{flex-direction:column;max-width:none}
    .ask-row .af-input-wrap{width:100%}
    .section-head{flex-direction:column;align-items:flex-start}
  }
  /* Living animations */
  .screen-enter{animation:af-fade-in var(--duration-fade) var(--ease-out) both}
  .metric-stagger{animation:af-slide-up var(--duration-slide) var(--ease-out) both}
  .modal-stage .af-modal{animation:af-scale-in var(--duration-scale) var(--ease-spring) both}
  .modal-stage .af-modal-overlay{animation:af-fade-in var(--duration-fade) var(--ease-out) both}

  @media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function Icon({name, size}) {
  return <i data-lucide={name} style={{width:size||20,height:size||20,display:'inline-block'}}></i>;
}

function AiCore({size, thinking}) {
  return (
    <div className={"af-ai-core " + size + (thinking ? " thinking" : "")} data-component="ai-core">
      <div className="af-ai-core-glow"></div>
      <div className="af-ai-core-sphere">
        {thinking && (
          <div className="orbit">
            <span className="particle"></span>
            <span className="particle"></span>
            <span className="particle"></span>
          </div>
        )}
        <div className="af-ai-core-center"></div>
      </div>
    </div>
  );
}

function Sidebar({screen, setScreen}) {
  const items = [
    {id:'dashboard', label:'Dashboard', icon:'layout-dashboard'},
    {id:'report', label:'Intelligence', icon:'file-text'},
    {id:'settings', label:'Settings', icon:'settings'}
  ];
  return (
    <aside className="uikit-sidebar">
      <div className="sidebar-card" data-component="navigation">
        <div className="af-nav-logo">
          <span className="mark"></span>
          <span className="uikit-truncate">Alice Future</span>
        </div>
        <nav className="sidebar-nav">
          {items.map(it => (
            <a key={it.id} className={"af-nav-item" + (screen===it.id ? " is-active" : "")}
               onClick={() => setScreen(it.id)}>
              <Icon name={it.icon} size={18} />
              <span className="uikit-truncate">{it.label}</span>
            </a>
          ))}
        </nav>
      </div>
      <div className="sidebar-card">
        <div className="af-nav-logo">
          <AiCore size="sm" />
          <span className="uikit-truncate">Alice AI</span>
        </div>
        <div className="sidebar-foot">
          <span className="status-dot"></span>
          <span className="meta">Online · Living tech<br/>v1.0 · Pure Intelligence</span>
        </div>
      </div>
    </aside>
  );
}
function TopNav({screen}) {
  const menu = {dashboard:'Today', report:'Reports', settings:'Config'};
  return (
    <nav className="af-nav" data-component="navigation">
      <div className="af-nav-logo">
        <span className="mark"></span>
        <span className="uikit-nowrap">{menu[screen]}</span>
      </div>
      <div className="af-nav-menu nav-search">
        <div className="af-input-wrap" data-component="input" style={{width:'100%'}}>
          <Icon name="search" size={18} />
          <input className="af-input glass has-icon" type="text" placeholder="Ask Alice anything..." />
        </div>
      </div>
      <div className="af-nav-user">
        <button className="af-nav-item" aria-label="Notifications"><Icon name="bell" size={18} /></button>
        <div className="af-nav-avatar">A</div>
      </div>
    </nav>
  );
}

function MetricCard({m, idx}) {
  return (
    <div className={"af-card " + m.variant + " metric-stagger"} data-component="card" style={{animationDelay:(idx*80)+'ms'}}>
      <div className="metric-top">
        <h3 className="af-card-title" style={{fontSize:'var(--font-size-body)'}}>{m.title}</h3>
        <span className="metric-icon"><Icon name={m.icon} size={18} /></span>
      </div>
      <div className="metric-num num">{m.value}</div>
      <div className="metric-unit">{m.unit}</div>
    </div>
  );
}

function ScreenDashboard() {
  const metrics = [
    {title:'Memory Module', value:'8,492', unit:'tokens active', variant:'glass-light', icon:'database'},
    {title:'AI Analysis', value:'3', unit:'models processing', variant:'glass-blue', icon:'cpu'},
    {title:'System Status', value:'Operational', unit:'all systems nominal', variant:'glass-light', icon:'activity'}
  ];
  const bars = [38,52,44,61,73,58,66,82,71,64,74,68];
  const max = 88;
  return (
    <React.Fragment>
      <div className="hero-band" data-component="card">
        <span className="hero-eyebrow">Today Intelligence</span>
        <AiCore size="lg" />
        <h1 className="hero-title">Ask Alice anything</h1>
        <div className="ask-row">
          <div className="af-input-wrap" data-component="input">
            <Icon name="search" size={18} />
            <input className="af-input glass has-icon" type="text" placeholder="Ask Alice anything..." />
          </div>
          <button className="af-btn af-btn-primary af-btn-md" data-component="button">
            <Icon name="sparkles" size={18} />
            <span className="af-btn-label">Start Analysis</span>
          </button>
        </div>
      </div>

      <div className="section-head">
        <div>
          <h2>Live modules</h2>
          <p className="desc">Real-time signal from the Alice intelligence core.</p>
        </div>
        <span className="status-pill"><span className="status-dot"></span>All systems operational</span>
      </div>

      <div className="uikit-responsive-grid">
        {metrics.map((m,i) => <MetricCard key={m.title} m={m} idx={i} />)}
      </div>

      <div className="af-card glass-light" data-component="card">
        <div className="metric-top">
          <h3 className="af-card-title" style={{fontSize:'var(--font-size-body)'}}>Token usage — last 12 cycles</h3>
          <span className="status-pill"><Icon name="trending-up" size={14} />Peak cycle 7</span>
        </div>
        <div className="chart-bars">
          {bars.map((v,i) => (
            <div key={i} className={"chart-bar" + (i===7 ? " peak" : "")}
                 style={{height: (v/max*100) + '%'}} title={"Cycle " + (i+1) + ": " + v + "k tokens"}></div>
          ))}
        </div>
        <div className="chart-axis"><span>Cycle 1</span><span>Cycle 12</span></div>
      </div>

      <div className="action-row" data-component="button">
        <button className="af-btn af-btn-ghost af-btn-md"><Icon name="refresh-cw" size={16} /><span className="af-btn-label">Sync memory</span></button>
        <button className="af-btn af-btn-secondary af-btn-md" disabled><Icon name="pause" size={16} /><span className="af-btn-label">Pause training</span></button>
      </div>
    </React.Fragment>
  );
}

function ScreenReport() {
  const insights = [
    {title:'Sentiment trend rising', desc:'Positive signal across 1,204 entries', icon:'trending-up'},
    {title:'Anomaly at cycle 7', desc:'Token spike 2.3× baseline detected', icon:'alert-triangle'},
    {title:'Cluster drift detected', desc:'2 semantic clusters re-organized', icon:'git-branch'}
  ];
  return (
    <React.Fragment>
      <div className="section-head">
        <div>
          <h2>Intelligence report</h2>
          <p className="desc">Analysis complete. 3 insights found in your data.</p>
        </div>
        <span className="status-pill"><Icon name="check" size={14} />Complete</span>
      </div>

      <div className="modal-stage" data-component="modal">
        <div className="af-modal-overlay">
          <div className="af-modal" role="dialog" aria-modal="true" aria-labelledby="rpt-title">
            <div className="af-modal-header">
              <h2 className="af-modal-title" id="rpt-title">Analysis complete</h2>
              <button className="af-modal-close" aria-label="Close"><Icon name="x" size={20} /></button>
            </div>
            <div className="af-modal-body">
              3 insights found in your data. Alice has ranked them by confidence and impact. Open the report to review each finding before exporting.
            </div>
            <div className="action-row" style={{marginTop:'var(--space-4)'}} data-component="button">
              <button className="af-btn af-btn-primary af-btn-md"><Icon name="file-text" size={16} /><span className="af-btn-label">Open insights</span></button>
              <button className="af-btn af-btn-ghost af-btn-md"><span className="af-btn-label">Cancel</span></button>
            </div>
          </div>
        </div>
      </div>

      <div className="uikit-responsive-grid">
        {insights.map(it => (
          <div key={it.title} className="af-card glass-light" data-component="card">
            <div className="metric-top">
              <span className="insight-icon"><Icon name={it.icon} size={18} /></span>
              <span className="status-pill"><Icon name="sparkles" size={12} />Insight</span>
            </div>
            <h3 className="af-card-title" style={{fontSize:'var(--font-size-body)'}}>{it.title}</h3>
            <p className="af-card-body">{it.desc}</p>
          </div>
        ))}
      </div>

      <div className="action-row" data-component="button">
        <button className="af-btn af-btn-secondary af-btn-md"><Icon name="download" size={16} /><span className="af-btn-label">Export</span></button>
        <button className="af-btn af-btn-secondary af-btn-md"><Icon name="share-2" size={16} /><span className="af-btn-label">Share</span></button>
        <button className="af-btn af-btn-ghost af-btn-md" disabled><Icon name="clock" size={16} /><span className="af-btn-label">Schedule sync</span></button>
      </div>
    </React.Fragment>
  );
}

function ScreenSettings() {
  const [prefs, setPrefs] = useState({auto:true, mem:true, breath:true, adapt:false});
  const toggle = k => setPrefs(p => ({...p, [k]: !p[k]}));
  const prefsList = [
    {k:'auto', label:'Auto-analysis', desc:'Run Alice on new data automatically', ai:false},
    {k:'mem', label:'Memory persistence', desc:'Keep context across sessions', ai:false},
    {k:'breath', label:'AI Core breathing', desc:'Animate the intelligence orb', ai:true},
    {k:'adapt', label:'Adaptive responses', desc:'Let Alice tune tone per session', ai:true}
  ];
  return (
    <React.Fragment>
      <div className="section-head">
        <div>
          <h2>Settings &amp; control</h2>
          <p className="desc">Configure how Alice thinks, remembers, and responds.</p>
        </div>
        <span className="status-pill"><Icon name="shield" size={14} />Secure</span>
      </div>

      <div className="af-card glass-light" data-component="card">
        <h3 className="af-card-title" style={{fontSize:'var(--font-size-body)'}}>API connection</h3>
        <div className="uikit-responsive-grid" style={{marginTop:'var(--space-3)'}}>
          <div className="field-row" data-component="input">
            <label className="field-label">API endpoint</label>
            <div className="af-input-wrap">
              <Icon name="globe" size={18} />
              <input className="af-input has-icon field-input" type="text" defaultValue="https://api.alice.future/v1" />
            </div>
            <span className="field-help">Alice routes intelligence requests here.</span>
          </div>
          <div className="field-row" data-component="input">
            <label className="field-label">Model context window</label>
            <div className="af-input-wrap">
              <Icon name="cpu" size={18} />
              <input className="af-input has-icon field-input num" type="text" defaultValue="8192" />
            </div>
            <span className="field-help">Maximum tokens held in active memory.</span>
          </div>
        </div>
        <div className="field-row" style={{marginTop:'var(--space-4)'}} data-component="input">
          <label className="field-label">License key</label>
          <input className="af-input field-input" type="text" placeholder="License locked" disabled />
          <span className="field-help">Managed by your workspace administrator.</span>
        </div>
      </div>

      <div className="af-card glass-blue" data-component="card">
        <h3 className="af-card-title" style={{fontSize:'var(--font-size-body)'}}>Preferences</h3>
        {prefsList.map(p => (
          <div key={p.k} className="pref-row">
            <div style={{minWidth:0}}>
              <p className="pref-label">{p.label}{p.ai ? ' · AI' : ''}</p>
              <p className="pref-desc">{p.desc}</p>
            </div>
            <button className={"switch" + (prefs[p.k] ? " on" : "")} role="switch" aria-checked={prefs[p.k]}
                    onClick={() => toggle(p.k)} aria-label={p.label}><span className="knob"></span></button>
          </div>
        ))}
      </div>

      <div className="action-row" data-component="button">
        <button className="af-btn af-btn-primary af-btn-md"><Icon name="check" size={16} /><span className="af-btn-label">Save changes</span></button>
        <button className="af-btn af-btn-secondary af-btn-md"><Icon name="rotate-ccw" size={16} /><span className="af-btn-label">Reset</span></button>
        <button className="af-btn af-btn-ghost af-btn-md"><span className="af-btn-label">Cancel</span></button>
      </div>
    </React.Fragment>
  );
}

function App() {
  const [screen, setScreen] = useState('dashboard');
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [screen]);
  return (
    <div className="uikit-shell" data-layout-guard="uikit-v1" style={{'--uikit-sidebar-w':'220px'}}>
      <Sidebar screen={screen} setScreen={setScreen} />
      <main className="uikit-main">
        <TopNav screen={screen} />
        <div key={screen} className="screen-enter">
        {screen === 'dashboard' && <ScreenDashboard />}
        {screen === 'report' && <ScreenReport />}
        {screen === 'settings' && <ScreenSettings />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>if (window.lucide) window.lucide.createIcons();</script>
</body>
</html>
